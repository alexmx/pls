# xc configuration for pls: a Swift package, driven through SwiftPM.
# Run `xc list` to see all commands.

commands:
  build:
    run: "swift build"
    variants:
      release:
        run: "swift build -c release"

  test:
    run: "swift test"

  format:
    run: "swiftformat ."
    variants:
      # Fail (don't change files) if anything is unformatted.
      check:
        run: "swiftformat --lint ."

  lint:
    run: "swiftlint lint --quiet --strict"

  # Run before every commit. Stops at the first failing step; `xc verify --continue` runs them all.
  verify:
    steps: [format:check, lint, build, test]

  # How well the model picks and fills (needs Apple Intelligence; ~1 min). Example: xc evals -- dark
  evals:
    run: "swift run PlsEvals"

  # Record the README's demo GIF from assets/demo.tape (needs vhs, qrencode and Apple Intelligence).
  demo:
    run: "swift build -c release && vhs assets/demo.tape"

  # Run the CLI. Example: xc pls -- list
  pls:
    run: "swift run pls"
