name: Release

# Releases when `.pls-version` changes on main: tags vX.Y.Z, publishes the binary and updates the Homebrew formula.
# The push trigger stays off until the repo is public; until then this only runs when started by hand.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['.pls-version']

permissions:
  contents: write  # Needed to create releases and tags

jobs:
  build-release:
    # pls uses the macOS 27 SDK (FoundationModels' LanguageModelError), so it needs Xcode 27; Apple silicon only.
    runs-on: xcode-27
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git operations

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Read version from .pls-version
        id: version
        run: |
          VERSION=$(cat .pls-version)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from .pls-version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.VERSION }} already exists, skipping release"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v${{ steps.version.outputs.VERSION }} does not exist, proceeding with release"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Pls.swift
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          printf 'public enum Pls {\n    public static let version = "%s"\n}\n' "${{ steps.version.outputs.VERSION }}" > Sources/PlsCore/Pls.swift
          cat Sources/PlsCore/Pls.swift

      - name: Run unit tests
        if: steps.check_tag.outputs.exists == 'false'
        run: swift test

      - name: Build release binary
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          swift build -c release
          strip .build/release/pls
          ls -lh .build/release/pls

      - name: Verify version in binary
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          EXPECTED_VERSION="${{ steps.version.outputs.VERSION }}"
          ACTUAL_VERSION=$(.build/release/pls --version)
          echo "Expected: $EXPECTED_VERSION"
          echo "Actual: $ACTUAL_VERSION"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi
          echo "Version verified: $ACTUAL_VERSION"

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.VERSION }}" -m "Release v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Package binary
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd .build/release
          zip pls-${{ steps.version.outputs.VERSION }}-macos.zip pls
          shasum -a 256 pls-${{ steps.version.outputs.VERSION }}-macos.zip > pls-${{ steps.version.outputs.VERSION }}-macos.zip.sha256
          ls -lh pls-${{ steps.version.outputs.VERSION }}-macos.zip*

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .build/release/pls-${{ steps.version.outputs.VERSION }}-macos.zip
            .build/release/pls-${{ steps.version.outputs.VERSION }}-macos.zip.sha256

      - name: Update Homebrew formula
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SHA256=$(shasum -a 256 .build/release/pls-${VERSION}-macos.zip | awk '{print $1}')
          echo "Binary zip SHA256: $SHA256"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/alexmx/homebrew-tools.git" /tmp/homebrew-tools
          cd /tmp/homebrew-tools

          sed -i '' "s|url \".*\"|url \"https://github.com/alexmx/pls/releases/download/v${VERSION}/pls-${VERSION}-macos.zip\"|" Formula/pls.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/pls.rb

          echo "Updated Formula/pls.rb:"
          cat Formula/pls.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pls.rb
          git commit -m "Update pls to v${VERSION}"
          git push
